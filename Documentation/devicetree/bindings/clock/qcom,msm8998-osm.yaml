%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,msm8998-osm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm MSM8998 Operating State Manager (OSM) CPU clocks

maintainers:
  - Lance <Gero3977@gmail.com>

description: |
  The OSM block of MSM8998 switches the frequency of each CPU cluster by
  walking a lookup table the kernel programs into it.  Unlike the OSM of
  later SoCs, whose table the firmware fills, MSM8998 takes the table from
  the device tree: one row per performance level, five cells per row:

    <frequency-hz freq-data pll-override-data spare-data virtual-corner>

  Clock index 0 is the power (little) cluster, 1 the performance (big)
  cluster.

properties:
  compatible:
    const: qcom,msm8998-osm

  reg:
    items:
      - description: OSM registers
      - description: Power cluster PLL
      - description: Performance cluster PLL

  reg-names:
    items:
      - const: osm
      - const: pwrcl_pll
      - const: perfcl_pll

  interrupts:
    items:
      - description: Power cluster OSM interrupt
      - description: Performance cluster OSM interrupt

  interrupt-names:
    items:
      - const: pwrcl-irq
      - const: perfcl-irq

  clocks:
    items:
      - description: GPLL0, the auxiliary clock source

  clock-names:
    items:
      - const: aux_clk

  '#clock-cells':
    const: 1

  qcom,speedbin:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Speed bin whose tables to use.  Defaults to 0.

patternProperties:
  '^qcom,(pwr|perf)cl-speedbin[0-9]+-v0$':
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    description: OSM lookup table of a cluster for one speed bin.
    maxItems: 40
    items:
      items:
        - description: Frequency in Hz
        - description: Frequency data (PLL source, divider, L value)
        - description: PLL override data
        - description: Spare data
        - description: Virtual voltage corner, 1-based

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - '#clock-cells'
  - qcom,pwrcl-speedbin0-v0
  - qcom,perfcl-speedbin0-v0

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-msm8998.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    clock-controller@179c0000 {
        compatible = "qcom,msm8998-osm";
        reg = <0x179c0000 0x4000>,
              <0x17916000 0x1000>,
              <0x17816000 0x1000>;
        reg-names = "osm", "pwrcl_pll", "perfcl_pll";
        interrupts = <GIC_SPI 35 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 36 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "pwrcl-irq", "perfcl-irq";
        #clock-cells = <1>;
        clocks = <&gcc GPLL0>;
        clock-names = "aux_clk";

        qcom,pwrcl-speedbin0-v0 =
            <300000000 0x0004000f 0x01200020 0x1 1>,
            <364800000 0x05040013 0x01200020 0x1 2>;
        qcom,perfcl-speedbin0-v0 =
            <300000000 0x0004000f 0x01200020 0x1 1>,
            <345600000 0x05040012 0x01200020 0x1 2>;
    };
