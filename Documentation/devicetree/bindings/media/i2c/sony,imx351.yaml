%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx351.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX351 16MP CMOS Image Sensor

maintainers:
  - Lance <Gero3977@gmail.com>

description:
  The Sony IMX351 is a 16MP stacked CMOS image sensor for mobile phones,
  with an active array of 4656 x 3496 pixels.  It is controlled over I2C and
  sends RAW10 Bayer data over a 4-lane MIPI CSI-2 D-PHY link.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx351

  reg:
    enum:
      - 0x10
      - 0x1a

  clocks:
    description: The sensor's external clock (INCK).
    maxItems: 1

  reset-gpios:
    description: The sensor's XCLR reset pin, active low.
    maxItems: 1

  avdd-supply:
    description: Analog supply, 2.8 V.

  dvdd-supply:
    description: Digital core supply.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  flash-leds: true
  lens-focus: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@1a {
            compatible = "sony,imx351";
            reg = <0x1a>;

            clocks = <&mmcc_mclk0>;
            assigned-clocks = <&mmcc_mclk0>;
            assigned-clock-rates = <24000000>;

            reset-gpios = <&tlmm 30 GPIO_ACTIVE_LOW>;

            avdd-supply = <&cam0_avdd_2p8>;
            dvdd-supply = <&cam0_dvdd>;
            dovdd-supply = <&vreg_lvs1a_1p8>;

            orientation = <1>;
            rotation = <90>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <600000000>;
                    remote-endpoint = <&csiphy0_ep>;
                };
            };
        };
    };
...
