%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/hynix,hi553.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hynix HI553 5MP CMOS Image Sensor

maintainers:
  - Lance <Gero3977@gmail.com>

description:
  The Hynix HI553 is a 5 MP CMOS image sensor for mobile phones, with an
  active array of 2560 x 1920 pixels.  It is controlled over I2C and sends
  RAW10 Bayer data over a 2-lane MIPI CSI-2 D-PHY link.  In the LG V30 it
  is the fixed-focus front (VT) camera.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: hynix,hi553

  reg:
    maxItems: 1

  clocks:
    description: The sensor's external clock (INCK).
    maxItems: 1

  reset-gpios:
    description: The sensor's XCLR reset pin, active low.
    maxItems: 1

  avdd-supply:
    description: Analog supply, 2.8 V.

  dvdd-supply:
    description: Digital core supply.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@28 {
            compatible = "hynix,hi553";
            reg = <0x28>;

            clocks = <&mmcc_mclk2>;
            assigned-clocks = <&mmcc_mclk2>;
            assigned-clock-rates = <24000000>;

            reset-gpios = <&tlmm 9 GPIO_ACTIVE_LOW>;

            avdd-supply = <&cam_vana_2p8>;
            dvdd-supply = <&cam1_dvdd_1p05>;
            dovdd-supply = <&cam_vio_1p8>;

            orientation = <0>;
            rotation = <90>;

            port {
                endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <440000000>;
                    remote-endpoint = <&csiphy2_ep>;
                };
            };
        };
    };
...
